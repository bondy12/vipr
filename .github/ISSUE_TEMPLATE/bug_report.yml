name: Bug report
description: Report a reproducible VIPR problem
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include command, input shape and output. Do not post secrets.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: v22.x
